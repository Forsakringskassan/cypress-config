name: Test

on: [push, pull_request]

permissions:
    contents: read
    checks: write

jobs:
    cypress-ct:
        name: Cypress Component Tests
        runs-on: ubuntu-latest
        strategy:
            matrix:
                cypress-version: [15.x, 16.x]
        steps:
            - name: Checkout
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
            - name: Use Node.js 24.x
              uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
              with:
                  node-version: 24.x
            - name: Install dependencies
              run: npm ci
            - name: Build
              run: npm run build
            - name: Install Cypress ${{ matrix.cypress-version }}
              run: npm install --no-save $(npx -y npm-min-peer cypress --major ${{ matrix.cypress-version }} --with-name)
            - name: Cypress Component Testing
              uses: cypress-io/github-action@bc982daf1fc26474fa0cf2c355d6c910616ce411 # v7.4.7
              with:
                  summary-title: "Component tests"
                  browser: chrome
                  component: true
                  install: false
                  quiet: true
            - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
              if: always()
              with:
                  name: cypress-screenshots
                  path: cypress/screenshots
                  if-no-files-found: ignore
