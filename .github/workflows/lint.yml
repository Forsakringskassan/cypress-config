name: Lint

on: [push, pull_request]

permissions:
    contents: read

jobs:
    lint:
        name: Lint
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
            - name: Use Node.js 24.x
              uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
              with:
                  node-version: 24.x
            - name: Install dependencies
              run: npm ci
            - name: Prettier
              uses: Forsakringskassan/prettier-config@ca6d21e7494c04c4fc135199d37b15bc72ebeaec # v3.7.12
            - name: ESLint
              if: success() || failure()
              uses: Forsakringskassan/eslint-config@e2b1d3801f8f7a68266d84649e0e296c5afdc95e # v15.11.14
